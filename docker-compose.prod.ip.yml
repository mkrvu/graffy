# IP / тест без домена. Запуск:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.ip.yml up -d --build

services:
  nginx:
    ports:
      - "${HTTP_PORT:-80}:80"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
