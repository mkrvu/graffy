name: Server setup

# Одноразовая установка GRAFFY на новый VPS. Запуск: Actions → Server setup → Run workflow.
# Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST      — IP сервера
#   SSH_PASSWORD  — пароль root (или SSH_KEY — приватный ключ)
#   SSH_USER      — необязательно, по умолчанию root
#   SSH_PORT      — необязательно, по умолчанию 22

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Домен (A-запись уже указывает на IP сервера)"
        required: true
      email:
        description: "E-mail для Let's Encrypt"
        required: true

jobs:
  setup:
    name: Install on VPS
    runs-on: ubuntu-latest
    steps:
      # github.com часто недоступен с российских VPS, поэтому код отправляем с раннера по SSH, без git clone на сервере.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack source
        run: tar czf /tmp/graffy-src.tgz --exclude=.git . && mv /tmp/graffy-src.tgz graffy-src.tgz

      # Образы собираем здесь: с российских VPS недоступны mcr.microsoft.com и часть реестров.
      - name: Build Docker images
        env:
          NEXT_PUBLIC_API_URL: https://${{ inputs.domain }}
        run: docker compose -f docker-compose.prod.yml build frontend backend

      - name: Save Docker images
        run: docker save graffy-frontend:latest graffy-backend:latest | gzip > /tmp/graffy-images.tgz && mv /tmp/graffy-images.tgz graffy-images.tgz

      - name: Upload source and images to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 120s
          source: graffy-src.tgz,graffy-images.tgz
          target: /tmp
          command_timeout: 30m

      - name: Install via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOMAIN: ${{ inputs.domain }}
          CERTBOT_EMAIL: ${{ inputs.email }}
        with:
          envs: DOMAIN,CERTBOT_EMAIL
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 60m
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive
            mkdir -p /opt/graffy
            tar xzf /tmp/graffy-src.tgz -C /opt/graffy
            rm -f /tmp/graffy-src.tgz
            cd /opt/graffy
            DOMAIN="$DOMAIN" CERTBOT_EMAIL="$CERTBOT_EMAIL" bash scripts/server-setup.sh

      - name: Diagnostics (on failure)
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 5m
          script: |
            echo "=== uptime / memory ==="; uptime; free -h
            echo "=== containers ==="; docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            echo "=== nginx logs ==="; docker logs --tail 40 graffy-nginx-1 2>&1 || true
            echo "=== listening :80/:443 ==="; ss -tlnp | grep -E ':(80|443)\b' || echo "nothing listens on 80/443"
            echo "=== local curl ==="; curl -sI --max-time 5 http://127.0.0.1/ | head -5 || echo "local curl failed"
            echo "=== ufw / iptables ==="; (ufw status 2>&1 | head -12); iptables -S INPUT 2>&1 | head -12
            echo "=== OOM ==="; dmesg 2>/dev/null | grep -i -E 'out of memory|killed process' | tail -5 || true
