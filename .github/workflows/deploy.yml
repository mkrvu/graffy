name: Deploy

on:
  push:
    branches:
      - main

# Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST      — IP или hostname сервера
#   SSH_PASSWORD  — пароль SSH (или SSH_KEY — приватный ключ PEM)
#   SSH_USER      — пользователь SSH (необязательно, по умолчанию root)
#   SSH_PORT      — порт SSH (необязательно, по умолчанию 22)
#   DEPLOY_PATH   — путь к клону на сервере (необязательно, по умолчанию /opt/graffy)
#
# Первая установка сервера: Actions → Server setup (scripts/server-setup.sh).

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Skip if server secrets are not configured
        if: env.VPS_HOST == ''
        run: echo "::notice::VPS_HOST secret is not set — deploy skipped. Configure secrets in Settings → Secrets and variables → Actions."

      - name: Checkout
        if: env.VPS_HOST != ''
        uses: actions/checkout@v4

      # github.com часто недоступен с российских VPS: код отправляем с раннера, а не git pull на сервере.
      - name: Pack source
        if: env.VPS_HOST != ''
        run: tar czf graffy-src.tgz --exclude=.git --exclude=graffy-src.tgz .

      - name: Upload source to VPS
        if: env.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: graffy-src.tgz
          target: /tmp

      - name: Deploy via SSH
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            DEPLOY_PATH='${{ secrets.DEPLOY_PATH || '/opt/graffy' }}'
            if [ ! -f "$DEPLOY_PATH/.env" ]; then
              echo "Сервер ещё не установлен ($DEPLOY_PATH/.env нет) — запустите workflow Server setup. Пропускаю."
              exit 0
            fi
            cd "$DEPLOY_PATH"
            echo "Unpacking uploaded source..."
            tar xzf /tmp/graffy-src.tgz -C "$DEPLOY_PATH"
            rm -f /tmp/graffy-src.tgz
            echo "Building and restarting services..."
            docker compose -f docker-compose.prod.yml --profile ssl pull --ignore-pull-failures || true
            docker compose -f docker-compose.prod.yml --profile ssl up --build -d
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
            echo "Cleaning up unused images..."
            docker image prune -f
            echo "Deploy complete."
