name: Deploy

on:
  push:
    branches:
      - main

# Secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST      — IP или hostname сервера
#   SSH_PASSWORD  — пароль SSH (или SSH_KEY — приватный ключ PEM)
#   SSH_USER      — пользователь SSH (необязательно, по умолчанию root)
#   SSH_PORT      — порт SSH (необязательно, по умолчанию 22)
#   DEPLOY_PATH   — путь к клону на сервере (необязательно, по умолчанию /opt/graffy)
#
# Первая установка сервера: Actions → Server setup (scripts/server-setup.sh).

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Skip if server secrets are not configured
        if: env.VPS_HOST == ''
        run: echo "::notice::VPS_HOST secret is not set — deploy skipped. Configure secrets in Settings → Secrets and variables → Actions."

      - name: Checkout
        if: env.VPS_HOST != ''
        uses: actions/checkout@v4

      # github.com часто недоступен с российских VPS: код отправляем с раннера, а не git pull на сервере.
      - name: Pack source
        if: env.VPS_HOST != ''
        run: tar czf /tmp/graffy-src.tgz --exclude=.git . && mv /tmp/graffy-src.tgz graffy-src.tgz

      # Образы собираем здесь: с российских VPS недоступны mcr.microsoft.com и часть реестров.
      # DOMAIN (необязательный секрет) нужен для NEXT_PUBLIC_API_URL; по умолчанию graffy.ru.
      - name: Build Docker images
        if: env.VPS_HOST != ''
        env:
          NEXT_PUBLIC_API_URL: https://${{ secrets.DOMAIN || 'graffy.ru' }}
        run: docker compose -f docker-compose.prod.yml build frontend backend

      - name: Save Docker images
        if: env.VPS_HOST != ''
        run: docker save graffy-frontend:latest graffy-backend:latest | gzip > /tmp/graffy-images.tgz && mv /tmp/graffy-images.tgz graffy-images.tgz

      - name: Upload source and images to VPS
        if: env.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 120s
          source: graffy-src.tgz,graffy-images.tgz
          target: /tmp
          command_timeout: 30m

      - name: Deploy via SSH
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            DEPLOY_PATH='${{ secrets.DEPLOY_PATH || '/opt/graffy' }}'
            if [ ! -f "$DEPLOY_PATH/.env" ] || [ ! -d "$DEPLOY_PATH/certbot/conf/live" ]; then
              echo "Сервер ещё не установлен (нет $DEPLOY_PATH/.env или сертификата) — запустите workflow Server setup. Пропускаю."
              rm -f /tmp/graffy-src.tgz /tmp/graffy-images.tgz
              exit 0
            fi
            cd "$DEPLOY_PATH"
            echo "Unpacking uploaded source..."
            tar xzf /tmp/graffy-src.tgz -C "$DEPLOY_PATH"
            rm -f /tmp/graffy-src.tgz
            echo "Loading prebuilt images..."
            docker load < /tmp/graffy-images.tgz
            rm -f /tmp/graffy-images.tgz
            echo "Restarting services..."
            docker compose -f docker-compose.prod.yml --profile ssl up --no-build -d
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload || true
            echo "Cleaning up unused images..."
            docker image prune -f
            echo "Deploy complete."
